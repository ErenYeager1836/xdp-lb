name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install LLVM, Clang and Kernel Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib linux-libc-dev
          if [ -d /usr/include/x86_64-linux-gnu/asm ] && [ ! -d /usr/include/asm ]; then
            sudo ln -s /usr/include/x86_64-linux-gnu/asm /usr/include/asm
          fi

      - name: Install bpf2go
        run: |
          go install github.com/cilium/ebpf/cmd/bpf2go@v0.17.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate eBPF Bytecode
        run: go generate ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -v -o xdp-lb .
